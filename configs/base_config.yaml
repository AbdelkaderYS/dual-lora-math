model:
  name: "EleutherAI/llemma_7b"
  torch_dtype: "bfloat16"

data:
  train_dataset: "meta-math/MetaMathQA"
  eval_gsm8k: "gsm8k"
  eval_math: "lighteval/MATH"
  max_seq_length: 1024
  num_workers: 4
  val_ratio: 0.02

training:
  num_epochs: 3
  per_device_train_batch_size: 24
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  optimizer: "adamw_torch"
  weight_decay: 0.01
  logging_steps: 50
  eval_strategy: "steps"
  eval_steps: 250
  save_strategy: "steps"
  save_steps: 250
  save_total_limit: 3
  seed: 42

evaluation:
  batch_size: 32
  max_new_tokens: 512
  temperature: 0.0

logging:
  use_wandb: false
  project: "dual-lora-math"
  report_to: "none"

lora:
  lora_alpha: 128
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

dual_lora:
  sign_ste_threshold: 0.0
  init_std: 0.02
